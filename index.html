        .card {

            max-width: 500px;

        }

            font-weight: 500;
            color: #555;
        }

            font-size: 1rem;
            box-sizing: border-box;
            margin-bottom: 1rem;
            transition: border-color 0.2s;

            outline: none;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-weight: 600;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #2980b9;
        }
        .feedback {
            margin-top: 1rem;
            font-weight: 600;
            padding: 0.5rem;
            border-radius: 4px;
            text-align: center;
        }
        .correct {
            background-color: #e8f8f5;
            color: #27ae60;
        }
        .incorrect {
            background-color: #fdedec;
            color: #c0392b;
        }
        .stats {
            margin-top: 1.5rem;
            font-size: 0.85rem;
            color: #7f8c8d;
            display: flex;
            justify-content: space-between;
        }

let correctCount = 0;
let isAnswered = false;

const germanPrompt = document.getElementById('germanPrompt');
const userInput = document.getElementById('userInput');
const submitBtn = document.getElementById('submitBtn');
const feedback = document.getElementById('feedback');
const progress = document.getElementById('progress');
const score = document.getElementById('score');

function loadQuestion() {
    if (currentIndex >= vocabDb.length) {
        germanPrompt.innerHTML = "<strong>Gratulation! Du hast alle Übungen abgeschlossen!</strong>";
        userInput.style.display = 'none';
        submitBtn.style.display = 'none';
        feedback.style.display = 'none';
        return;
    }

    const q = vocabDb[currentIndex];
    germanPrompt.innerHTML = `<div>${q.de}</div><div style="font-size: 0.95rem; color: #3498db; margin-top: 6px;">${q.pre}<span style="border-bottom: 2px solid #3498db; padding: 0 10px; display: inline-block;">...</span>${q.post}</div><div style="font-size: 0.8rem; color: #888; margin-top: 4px; font-weight: normal;"><i>Tipp: ${q.hint}</i></div>`;
    
    userInput.value = '';
    userInput.focus();
    feedback.style.display = 'none';
    feedback.className = 'feedback';
    submitBtn.textContent = 'Überprüfen';
    isAnswered = false;

    updateStats();
}

function updateStats() {
    progress.textContent = `Fortschritt: ${currentIndex + 1} / ${vocabDb.length}`;
    score.textContent = `Richtig: ${correctCount}`;
}

function checkAnswer() {
    if (currentIndex >= vocabDb.length) return;

    if (isAnswered) {
        currentIndex++;
        loadQuestion();
        return;
    }

    const currentAns = vocabDb[currentIndex].ans.trim();
    const userAns = userInput.value.trim();

    feedback.style.display = 'block';

    if (userAns.toLowerCase() === currentAns.toLowerCase()) {
        correctCount++;
        feedback.textContent = 'Richtig!';
        feedback.className = 'feedback correct';
    } else {
        feedback.textContent = `Falsch! Richtig ist: "${currentAns}"`;
        feedback.className = 'feedback incorrect';
    }

    isAnswered = true;
    submitBtn.textContent = 'Nächste Frage';
    updateStats();
}

userInput.addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
        checkAnswer();
    }
});

loadQuestion();
