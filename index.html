<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spanisch Vokabeltrainer (Random Modus)</title>
  <style>
    :root {
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --success: #16a34a;
      --danger: #dc2626;
      --text: #1f2937;
      --text-muted: #6b7280;
      --border: #e5e7eb;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: var(--card-bg);
      width: 100%;
      max-width: 600px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      padding: 28px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    h1 { font-size: 1.4rem; color: var(--text); }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }

    .row {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    select, button {
      padding: 10px 14px;
      font-size: 0.95rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      outline: none;
      transition: all 0.2s ease;
    }

    select {
      flex: 1;
      background: #fff;
      cursor: pointer;
    }

    button {
      background: var(--primary);
      color: white;
      border: none;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover { background: var(--primary-hover); }

    .btn-secondary {
      background: #6b7280;
    }
    .btn-secondary:hover { background: #4b5563; }

    .btn-repeat {
      background: #eab308;
      color: #fff;
    }
    .btn-repeat:hover { background: #ca8a04; }

    .toggle-group {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      color: var(--text-muted);
      cursor: pointer;
    }

    .toggle-group input {
      cursor: pointer;
      width: 16px;
      height: 16px;
    }

    .progress-bar-container {
      height: 8px;
      background: #e5e7eb;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: var(--primary);
      transition: width 0.3s ease;
    }

    .card {
      background: #fafafa;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      text-align: center;
      margin-bottom: 20px;
      position: relative;
    }

    .category-badge {
      display: inline-block;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      background: #e0e7ff;
      color: #3730a3;
      padding: 4px 10px;
      border-radius: 12px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .prompt {
      font-size: 1.3rem;
      font-weight: 600;
      margin-bottom: 20px;
      color: var(--text);
    }

    .input-group {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      gap: 6px;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }

    .input-group input {
      font-size: 1.1rem;
      padding: 8px 12px;
      border: 2px solid var(--border);
      border-radius: 8px;
      text-align: center;
      width: 180px;
      outline: none;
    }

    .input-group input:focus {
      border-color: var(--primary);
    }

    .hint-box {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 10px;
      min-height: 20px;
      font-style: italic;
    }

    .btn-hint {
      background: transparent;
      color: var(--text-muted);
      border: 1px dashed var(--border);
      padding: 4px 10px;
      font-size: 0.8rem;
      margin-top: 5px;
    }

    .btn-hint:hover { background: #f3f4f6; color: var(--text); }

    .feedback {
      padding: 12px;
      border-radius: 8px;
      font-weight: 600;
      margin-bottom: 20px;
      display: none;
    }

    .feedback.correct {
      background: #dcfce7;
      color: var(--success);
      border: 1px solid #86efac;
    }

    .feedback.incorrect {
      background: #fee2e2;
      color: var(--danger);
      border: 1px solid #fca5a5;
    }

    .action-btn {
      width: 100%;
      padding: 12px;
      font-size: 1rem;
    }

    .stats {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 15px;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Spanisch-Trainer</h1>
    <span id="counter" style="font-weight: 600; color: var(--text-muted);">0 / 0</span>
  </header>

  <div class="controls">
    <div class="row">
      <select id="blockSelect" onchange="loadSelectedBlock()">
        <!-- Dynamisch befüllt -->
      </select>
      <button class="btn-secondary" onclick="shuffleCurrentList()" title="Aktuelle Auswahl neu mischen">🎲 Mischen</button>
    </div>

    <div class="row" style="justify-content: space-between;">
      <label class="toggle-group">
        <input type="checkbox" id="chkRandom" checked onchange="loadSelectedBlock()">
        <span>Immer zufällig ausgeben (Random)</span>
      </label>

      <button class="btn-repeat" id="btnRepeatWrong" onclick="startRepeatMode()" style="display:none;">
        Fehler ( <span id="wrongCount">0</span> )
      </button>
    </div>
  </div>

  <div class="progress-bar-container">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <div class="card" id="quizCard">
    <div class="category-badge" id="catBadge">Kategorie</div>
    <div class="prompt" id="dePrompt">Deutsche Vokabel</div>
    
    <div class="input-group">
      <span id="preText"></span>
      <input type="text" id="userInput" placeholder="Antwort..." autocomplete="off" spellcheck="false">
      <span id="postText"></span>
    </div>

    <button class="btn-hint" onclick="toggleHint()">💡 Hinweis anzeigen</button>
    <div class="hint-box" id="hintBox" style="display:none;"></div>
  </div>

  <div class="feedback" id="feedback"></div>

  <button class="action-btn" id="btnSubmit" onclick="checkAnswer()">Überprüfen</button>

  <div class="stats">
    <span>Richtig: <strong id="scoreCorrect" style="color: var(--success);">0</strong></span>
    <span>Falsch: <strong id="scoreWrong" style="color: var(--danger);">0</strong></span>
  </div>
</div>

<script>
  // HIER DIE 489 VOKABELN EINFÜGEN:
  const vocabData = [
    { id: 1, cat: "Pronomen", de: "ich", pre: "", post: "", ans: "yo", hint: "Personalpronomen" },
    { id: 2, cat: "Pronomen", de: "du", pre: "", post: "", ans: "tú", hint: "Personalpronomen" },
    { id: 3, cat: "Pronomen", de: "er", pre: "", post: "", ans: "él", hint: "Personalpronomen" },
    { id: 4, cat: "Pronomen", de: "sie (Singular)", pre: "", post: "", ans: "ella", hint: "Personalpronomen" },
    { id: 319, cat: "Restaurant", de: "Eine Vorspeise, bitte.", pre: "Un ", post: ", por favor.", ans: "entrante", hint: "Vorspeise" }
    // Füge hier alle verbleibenden Vokabeln deines Datensatzes ein
  ];

  const BLOCK_SIZE = 30;
  let currentList = [];
  let currentIndex = 0;
  let wrongAnswers = [];
  let score = { correct: 0, wrong: 0 };
  let isChecked = false;

  // Fisher-Yates Shuffle Algorithmus für echtes Zufallsmischen
  function shuffleArray(array) {
    for (let i = array.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
  }

  window.onload = () => {
    buildBlockOptions();
    loadSelectedBlock();

    document.getElementById('userInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        if (!isChecked) {
          checkAnswer();
        } else {
          nextQuestion();
        }
      }
    });
  };

  function buildBlockOptions() {
    const select = document.getElementById('blockSelect');
    select.innerHTML = '';
    
    const totalBlocks = Math.ceil(vocabData.length / BLOCK_SIZE);
    
    for (let i = 0; i < totalBlocks; i++) {
      const start = i * BLOCK_SIZE + 1;
      const end = Math.min((i + 1) * BLOCK_SIZE, vocabData.length);
      const option = document.createElement('option');
      option.value = i;
      option.textContent = `Block ${i + 1} (${start} - ${end})`;
      select.appendChild(option);
    }

    const allOption = document.createElement('option');
    allOption.value = "all";
    allOption.textContent = `Alle Vokabeln (1 - ${vocabData.length})`;
    select.appendChild(allOption);
  }

  function loadSelectedBlock() {
    const val = document.getElementById('blockSelect').value;
    const isRandom = document.getElementById('chkRandom').checked;

    if (val === "all") {
      currentList = [...vocabData];
    } else {
      const blockIndex = parseInt(val);
      const start = blockIndex * BLOCK_SIZE;
      const end = start + BLOCK_SIZE;
      currentList = vocabData.slice(start, end);
    }

    if (isRandom) {
      shuffleArray(currentList);
    }

    resetSession();
  }

  function shuffleCurrentList() {
    shuffleArray(currentList);
    resetSession();
  }

  function startRepeatMode() {
    if (wrongAnswers.length === 0) return;
    currentList = [...wrongAnswers];
    if (document.getElementById('chkRandom').checked) {
      shuffleArray(currentList);
    }
    wrongAnswers = [];
    document.getElementById('btnRepeatWrong').style.display = 'none';
    resetSession();
  }

  function resetSession() {
    currentIndex = 0;
    score = { correct: 0, wrong: 0 };
    updateStats();
    showQuestion();
  }

  function showQuestion() {
    if (currentIndex >= currentList.length) {
      finishBlock();
      return;
    }

    isChecked = false;
    const item = currentList[currentIndex];

    document.getElementById('catBadge').textContent = item.cat || 'Allgemein';
    document.getElementById('dePrompt').textContent = item.de;
    document.getElementById('preText').textContent = item.pre || '';
    document.getElementById('postText').textContent = item.post || '';
    
    const input = document.getElementById('userInput');
    input.value = '';
    input.disabled = false;
    input.focus();

    document.getElementById('hintBox').style.display = 'none';
    document.getElementById('hintBox').textContent = item.hint || 'Kein Hinweis verfügbar.';

    const feedback = document.getElementById('feedback');
    feedback.style.display = 'none';

    const btn = document.getElementById('btnSubmit');
    btn.textContent = 'Überprüfen';
    btn.onclick = checkAnswer;

    updateProgress();
  }

  function toggleHint() {
    const hintBox = document.getElementById('hintBox');
    hintBox.style.display = hintBox.style.display === 'none' ? 'block' : 'none';
  }

  function checkAnswer() {
    if (isChecked) return;

    const item = currentList[currentIndex];
    const userVal = document.getElementById('userInput').value.trim().toLowerCase();
    const targetVal = item.ans.trim().toLowerCase();

    const feedback = document.getElementById('feedback');
    feedback.style.display = 'block';

    if (userVal === targetVal) {
      feedback.textContent = 'Richtig! ¡Muy bien!';
      feedback.className = 'feedback correct';
      score.correct++;
    } else {
      feedback.innerHTML = `Falsch! Richtig ist: <strong>${item.pre || ''}${item.ans}${item.post || ''}</strong>`;
      feedback.className = 'feedback incorrect';
      score.wrong++;
      
      if (!wrongAnswers.some(w => w.id === item.id)) {
        wrongAnswers.push(item);
      }
    }

    isChecked = true;
    document.getElementById('userInput').disabled = true;
    updateStats();

    const btn = document.getElementById('btnSubmit');
    btn.textContent = 'Weiter (Enter)';
    btn.onclick = nextQuestion;
  }

  function nextQuestion() {
    currentIndex++;
    showQuestion();
  }

  function updateProgress() {
    const total = currentList.length;
    const current = currentIndex + 1;
    document.getElementById('counter').textContent = `${Math.min(current, total)} / ${total}`;
    
    const pct = (currentIndex / total) * 100;
    document.getElementById('progressBar').style.width = `${pct}%`;
  }

  function updateStats() {
    document.getElementById('scoreCorrect').textContent = score.correct;
    document.getElementById('scoreWrong').textContent = score.wrong;
    
    const repeatBtn = document.getElementById('btnRepeatWrong');
    const wrongCountSpan = document.getElementById('wrongCount');
    
    if (wrongAnswers.length > 0) {
      repeatBtn.style.display = 'inline-block';
      wrongCountSpan.textContent = wrongAnswers.length;
    }
  }

  function finishBlock() {
    document.getElementById('progressBar').style.width = '100%';
    document.getElementById('quizCard').innerHTML = `
      <h2>Durchgang beendet! 🎉</h2>
      <p style="margin-top: 10px; color: var(--text-muted);">
        Ergebnis: <strong>${score.correct}</strong> richtig, <strong>${score.wrong}</strong> falsch.
      </p>
    `;
    document.getElementById('feedback').style.display = 'none';
    
    const btn = document.getElementById('btnSubmit');
    if (wrongAnswers.length > 0) {
      btn.textContent = 'Fehler jetzt wiederholen';
      btn.onclick = startRepeatMode;
    } else {
      btn.textContent = 'Nächsten Block laden';
      btn.onclick = () => {
        const select = document.getElementById('blockSelect');
        if (select.selectedIndex < select.options.length - 1) {
          select.selectedIndex++;
        }
        loadSelectedBlock();
      };
    }
  }
</script>
</body>
</html>
