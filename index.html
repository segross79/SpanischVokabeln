<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spanish Sentence Practice</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
            box-sizing: border-box;
        }
        h2 {
            margin-top: 0;
            color: #2c3e50;
            font-size: 1.25rem;
        }
        .german-sentence {
            font-size: 1.1rem;
            margin-bottom: 1.5rem;
            font-weight: 500;
            color: #555;
        }
        input[type="text"] {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 1rem;
            box-sizing: border-box;
            margin-bottom: 1rem;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus {
            border-color: #3498db;
            outline: none;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-weight: 600;
            transition: background-color 0.2s;
            margin-bottom: 0.5rem;
        }
        button:hover {
            background-color: #2980b9;
        }
        .secondary-btn {
            background-color: #95a5a6;
        }
        .secondary-btn:hover {
            background-color: #7f8c8d;
        }
        .feedback {
            margin-top: 1rem;
            font-weight: 600;
            padding: 0.5rem;
            border-radius: 4px;
            text-align: center;
        }
        .correct {
            background-color: #e8f8f5;
            color: #27ae60;
        }
        .incorrect {
            background-color: #fdedec;
            color: #c0392b;
        }
        .stats {
            margin-top: 1.5rem;
            font-size: 0.85rem;
            color: #7f8c8d;
            display: flex;
            justify-content: space-between;
        }
        .chapter-select {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
    </style>
</head>
<body>

    <div class="card">
        <div id="menuScreen">
            <h2>Wähle ein Kapitel</h2>
            <div class="chapter-select" id="chapterList">
                <!-- Wird dynamisch gefüllt -->
            </div>
        </div>

        <div id="quizScreen" style="display: none;">
            <h2 id="screenTitle">Übersetze ins Spanische (A1)</h2>
            <div id="modeIndicator" style="font-size: 0.85rem; color: #e67e22; font-weight: bold; margin-bottom: 10px;"></div>
            <div class="german-sentence" id="germanPrompt">Lade Satz...</div>
            
            <input type="text" id="userInput" placeholder="Deine Übersetzung hier..." autocomplete="off">
            <button id="submitBtn" onclick="checkAnswer()">Überprüfen</button>
            <button id="backToMenuBtn" class="secondary-btn" onclick="returnToMenu()" style="display: none;">Zurück zur Kapitelwahl</button>
            
            <div id="feedback" class="feedback" style="display: none;"></div>

            <div class="stats">
                <span id="progress">Fortschritt: 0 / 0</span>
                <span id="score">Richtig: 0</span>
            </div>
        </div>
    </div>

    <script>
const vocabDb = [
  // ==========================================
  // 1. VERBEN & AKTIONEN (1-150)
  // ==========================================
  { id: 1, cat: "Verben & Aktionen", de: "Ich bin müde.", pre: "Yo ", post: " cansado.", ans: "estoy", hint: "estar – sein (Zustand/Ort)" },
  { id: 2, cat: "Verben & Aktionen", de: "Er ist Spanier.", pre: "Él ", post: " español.", ans: "es", hint: "ser – sein (Eigenschaft)" },
  { id: 3, cat: "Verben & Aktionen", de: "Ich habe zwei Brüder.", pre: "Yo ", post: " dos hermanos.", ans: "tengo", hint: "tener – haben" },
  { id: 4, cat: "Verben & Aktionen", de: "Was machst du?", pre: "¿Qué ", post: " tú?", ans: "haces", hint: "hacer – machen/tun" },
  { id: 5, cat: "Verben & Aktionen", de: "Wir gehen ins Kino.", pre: "Nosotros ", post: " al cine.", ans: "vamos", hint: "ir – gehen/fahren" },
  { id: 6, cat: "Verben & Aktionen", de: "Es gibt viel Essen.", pre: "Tiene que ", post: " mucha comida.", ans: "haber", hint: "haber – geben/haben (Hilfsverb)" },
  { id: 7, cat: "Verben & Aktionen", de: "Kannst du mir helfen?", pre: "¿", post: " ayudarme?", ans: "Puedes", hint: "poder – können" },
  { id: 8, cat: "Verben & Aktionen", de: "Ich möchte ein Eis.", pre: "Yo ", post: " un helado.", ans: "quiero", hint: "querer – wollen/lieben" },
  { id: 9, cat: "Verben & Aktionen", de: "Ich weiß es nicht.", pre: "No lo ", post: ".", ans: "sé", hint: "saber – wissen" },
  { id: 10, cat: "Verben & Aktionen", de: "Wo legst du das Buch hin?", pre: "¿Dónde ", post: " el libro?", ans: "pones", hint: "poner – stellen/legen" },
  { id: 11, cat: "Verben & Aktionen", de: "Was sagst du?", pre: "¿Qué ", post: "?", ans: "dices", hint: "decir – sagen" },
  { id: 12, cat: "Verben & Aktionen", de: "Ich spreche Spanisch.", pre: "Yo ", post: " español.", ans: "hablo", hint: "hablar – sprechen" },
  { id: 13, cat: "Verben & Aktionen", de: "Ich höre Musik.", pre: "Yo ", post: " música.", ans: "escucho", hint: "escuchar – zuhören" },
  { id: 14, cat: "Verben & Aktionen", de: "Hörst du das?", pre: "¿", post: " eso?", ans: "Oyes", hint: "oír – hören" },
  { id: 15, cat: "Verben & Aktionen", de: "Ich sehe den Fernseher.", pre: "Yo ", post: " la televisión.", ans: "veo", hint: "ver – sehen" },

  // ==========================================
  // 2. ALLTAG & MENSCH
  // ==========================================
  { id: 238, cat: "Alltag & Mensch", de: "Der Boden ist sauber.", pre: "El ", post: " está limpio.", ans: "suelo", hint: "el suelo – der Boden" },
  { id: 239, cat: "Alltag & Mensch", de: "Die Decke ist hoch.", pre: "El ", post: " es alto.", ans: "techo", hint: "el techo – die Decke" },
  { id: 240, cat: "Alltag & Mensch", de: "Wir steigen die Treppe hoch.", pre: "Subimos por las ", post: ".", ans: "escaleras", hint: "las escaleras – die Treppe" },
  { id: 241, cat: "Alltag & Mensch", de: "Wo ist der Schlüssel?", pre: "¿Dónde está la ", post: "?", ans: "llave", hint: "la llave – der Schlüssel" },
  { id: 242, cat: "Alltag & Mensch", de: "Ein neues Möbelstück.", pre: "Un ", post: " nuevo.", ans: "mueble", hint: "el mueble – das Möbelstück" },

  // ==========================================
  // 3. ESSEN & TRINKEN
  // ==========================================
  { id: 284, cat: "Essen & Trinken", de: "Das Essen ist lecker.", pre: "La ", post: " está rica.", ans: "comida", hint: "la comida – das Essen" },
  { id: 285, cat: "Essen & Trinken", de: "Ein gutes Frühstück.", pre: "Un buen ", post: ".", ans: "desayuno", hint: "el desayuno – das Frühstück" },
  { id: 286, cat: "Essen & Trinken", de: "Das Mittagessen ist bereit.", pre: "El ", post: " está listo.", ans: "almuerzo", hint: "el almuerzo – das Mittagessen" },
  { id: 337, cat: "Essen & Trinken", de: "Ein süßer Keks.", pre: "Una ", post: " dulce.", ans: "galleta", hint: "la galleta – der Keks" },
  { id: 342, cat: "Essen & Trinken", de: "Die Rechnung, bitte.", pre: "La ", post: ", por favor.", ans: "cuenta", hint: "la cuenta – die Rechnung" },

  // ==========================================
  // 4. PHRASEN & AUSDRÜCKE
  // ==========================================
  { id: 913, cat: "Phrasen & Ausdrücke", de: "Nimm Platz.", pre: "¡Toma ", post: "!", ans: "asiento", hint: "tomar asiento – Platz nehmen" },
  { id: 914, cat: "Phrasen & Ausdrücke", de: "Fühl dich wie zu Hause.", pre: "Estás en tu ", post: ".", ans: "casa", hint: "en tu casa – wie zu Hause" },
  { id: 915, cat: "Phrasen & Ausdrücke", de: "Was möchtest du trinken?", pre: "¿Qué quieres ", post: "?", ans: "tomar", hint: "tomar – trinken/nehmen" },
  { id: 916, cat: "Phrasen & Ausdrücke", de: "Ich nehme ein Wasser.", pre: "Voy a tomar un ", post: ".", ans: "agua", hint: "el agua – das Wasser" },
  { id: 917, cat: "Phrasen & Ausdrücke", de: "Können Sie die Speisekarte bringen?", pre: "¿Nos trae la ", post: "?", ans: "carta", hint: "la carta – die Speisekarte" }
];

// Variablen für den Ablauf
let currentQueue = [];       // Die Vokabeln, die in der aktuellen Runde abgefragt werden
let failedQueue = [];        // Vokabeln, die falsch waren und wiederholt werden müssen
let currentIndex = 0;
let correctCount = 0;
let isAnswered = false;
let isRetryRound = false;    // Ob wir gerade in der Extra-Fehler-Runde sind

// DOM Elemente
const menuScreen = document.getElementById('menuScreen');
const quizScreen = document.getElementById('quizScreen');
const chapterList = document.getElementById('chapterList');
const germanPrompt = document.getElementById('germanPrompt');
const userInput = document.getElementById('userInput');
const submitBtn = document.getElementById('submitBtn');
const feedback = document.getElementById('feedback');
const progress = document.getElementById('progress');
const score = document.getElementById('score');
const modeIndicator = document.getElementById('modeIndicator');
const backToMenuBtn = document.getElementById('backToMenuBtn');

// 1. Kapitel-Menü beim Start aufbauen
function initMenu() {
    chapterList.innerHTML = '';
    // Alle eindeutigen Kategorien finden
    const categories = [...new Set(vocabDb.map(item => item.cat))];

    categories.forEach(cat => {
        const count = vocabDb.filter(item => item.cat === cat).length;
        const btn = document.createElement('button');
        btn.textContent = `${cat} (${count} Vokabeln)`;
        btn.onclick = () => startChapter(cat);
        chapterList.appendChild(btn);
    });
}

// 2. Kapitel starten
function startChapter(category) {
    // Kopie der Vokabeln aus diesem Kapitel erstellen
    currentQueue = vocabDb.filter(item => item.cat === category);
    failedQueue = [];
    currentIndex = 0;
    correctCount = 0;
    isRetryRound = false;

    menuScreen.style.display = 'none';
    quizScreen.style.display = 'block';
    backToMenuBtn.style.display = 'none';
    modeIndicator.textContent = `Kapitel: ${category}`;

    loadQuestion();
}

function returnToMenu() {
    quizScreen.style.display = 'none';
    menuScreen.style.display = 'block';
    initMenu();
}

function loadQuestion() {
    if (currentIndex >= currentQueue.length) {
        // Runden-Ende erreicht! Prüfen, ob es Fehler gab
        if (failedQueue.length > 0) {
            // Es gibt Fehler -> Starte die Wiederholungsrunde
            currentQueue = [...failedQueue];
            failedQueue = [];
            currentIndex = 0;
            isRetryRound = true;
            modeIndicator.textContent = `Wiederholungsrunde der Fehler!`;
            alert("Runde beendet! Jetzt werden alle falsch beantworteten Vokabeln so lange wiederholt, bis sie sitzen.");
        } else {
            // Komplett fertig mit diesem Kapitel!
            germanPrompt.innerHTML = "<strong>🎉 Super! Du hast alle Vokabeln dieses Kapitels (inklusive Wiederholungen) fehlerfrei gemeistert!</strong>";
            userInput.style.display = 'none';
            submitBtn.style.display = 'none';
            feedback.style.display = 'none';
            backToMenuBtn.style.display = 'block';
            modeIndicator.textContent = "Kapitel abgeschlossen!";
            return;
        }
    }

    const q = currentQueue[currentIndex];
    germanPrompt.innerHTML = `<div>${q.de}</div><div style="font-size: 0.95rem; color: #3498db; margin-top: 6px;">${q.pre}<span style="border-bottom: 2px solid #3498db; padding: 0 10px; display: inline-block;">...</span>${q.post}</div><div style="font-size: 0.8rem; color: #888; margin-top: 4px; font-weight: normal;"><i>Tipp: ${q.hint}</i></div>`;
    
    userInput.value = '';
    userInput.focus();
    feedback.style.display = 'none';
    feedback.className = 'feedback';
    submitBtn.textContent = 'Überprüfen';
    isAnswered = false;

    updateStats();
}

function updateStats() {
    progress.textContent = `Fortschritt: ${currentIndex + 1} / ${currentQueue.length}`;
    score.textContent = `Richtig: ${correctCount}`;
}

function checkAnswer() {
    if (currentIndex >= currentQueue.length) return;

    if (isAnswered) {
        currentIndex++;
        loadQuestion();
        return;
    }

    const currentItem = currentQueue[currentIndex];
    const currentAns = currentItem.ans.trim();
    const userAns = userInput.value.trim();

    feedback.style.display = 'block';

    if (userAns.toLowerCase() === currentAns.toLowerCase()) {
        correctCount++;
        feedback.textContent = 'Richtig!';
        feedback.className = 'feedback correct';
    } else {
        feedback.textContent = `Falsch! Richtig ist: "${currentAns}"`;
        feedback.className = 'feedback incorrect';
        
        // Wenn die Vokabel falsch war und noch nicht in der Fehlerliste ist, fügen wir sie hinzu
        if (!failedQueue.includes(currentItem)) {
            failedQueue.push(currentItem);
        }
    }

    isAnswered = true;
    submitBtn.textContent = 'Nächste Frage';
    updateStats();
}

userInput.addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
        checkAnswer();
    }
});

// Menü initialisieren beim Laden der Seite
initMenu();
    </script>
</body>
</html>
