        .progress-label {

            font-size: 0.95rem;
            color: var(--text-muted);
            line-height: 1.5;

        .sentence-area {

            margin: 2rem 0;
        }

        .german-sentence {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
            color: var(--text-main);
        }

        .spanish-sentence {
            font-size: 1.15rem;
            font-style: italic;
            color: var(--text-muted);
        }

        .blank-line {
            display: inline-block;
            border-bottom: 2px dashed var(--primary);
            width: 100px;
            margin: 0 5px;
        }

        .blank-line.error-line {
            border-bottom: 2px dashed var(--error);
        }

        .input-container {
            margin-top: 1.5rem;
        }

        input[type="text"] {
            width: 100%;
            padding: 0.9rem 1rem;
            font-size: 1rem;
            background-color: #0f172a;
            border: 2px solid var(--border-color);
            border-radius: 0.75rem;
            color: var(--text-main);
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.2s;
            margin-bottom: 1rem;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
        }

        button {
            width: 100%;
            background-color: var(--primary);
            color: #0f172a;
            border: none;
            padding: 0.9rem;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 0.75rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {

        }

        .feedback {

            padding: 0.8rem;
            border-radius: 0.75rem;
            font-weight: 500;
            text-align: center;
            display: none;
        }

            padding-top: 1rem;

</head>

    // Statusvariablen & localStorage Initialisierung
    let score = parseInt(localStorage.getItem('vocab_score')) || 0;
    let streak = parseInt(localStorage.getItem('vocab_streak')) || 0;
    let currentIndex = parseInt(localStorage.getItem('vocab_currentIndex')) || 0;
    let isRetry = false;
    let currentItem = null;

    function saveProgress() {
        localStorage.setItem('vocab_score', score);
        localStorage.setItem('vocab_streak', streak);
        localStorage.setItem('vocab_currentIndex', currentIndex);
    }

    function updateUI() {
        document.getElementById('score-text').innerText = score;
        document.getElementById('streak-text').innerText = streak;
        document.getElementById('progress-text').innerText = `Frage ${currentIndex + 1} / ${vocabDb.length}`;
    }

    function loadQuestion() {
        if (currentIndex >= vocabDb.length) {
            currentIndex = 0; // Zyklus von vorne beginnen oder Endbildschirm anzeigen
        }

        currentItem = vocabDb[currentIndex];
        
        document.getElementById('badge-category').innerText = currentItem.cat;
        if (isRetry) {
            document.getElementById('badge-category').className = "badge retry-badge";
            document.getElementById('badge-category').innerText = "Wiederholung";
        } else {
            document.getElementById('badge-category').className = "badge";
        }

        document.getElementById('hint-text').innerText = currentItem.hint;
        document.getElementById('german-sentence').innerText = currentItem.de;

        const container = document.getElementById('spanish-container');
        container.innerHTML = `${currentItem.pre}<span class="blank-line" id="dynamic-blank"></span>${currentItem.post}`;

        document.getElementById('user-answer').value = '';
        document.getElementById('feedback').style.display = 'none';
        document.getElementById('action-btn').innerText = "Prüfen";
        
        updateUI();
    }

    function handleAction() {
        const userInputValue = document.getElementById('user-answer').value.trim().toLowerCase();
        const feedbackEl = document.getElementById('feedback');
        const blankLine = document.getElementById('dynamic-blank');

        if (!isRetry && document.getElementById('action-btn').innerText === "Prüfen") {
            // Prüfung der Antwort
            if (userInputValue === currentItem.ans.toLowerCase()) {
                feedbackEl.className = "feedback success";
                feedbackEl.innerText = "Richtig! Gut gemacht.";
                blankLine.classList.remove('error-line');
                blankLine.innerText = currentItem.ans;
                
                score += 10;
                streak += 1;
                document.getElementById('action-btn').innerText = "Weiter";
                
                if (!isRetry) {
                    currentIndex++;
                }
                isRetry = false;
                saveProgress();
            } else {
                feedbackEl.className = "feedback error";
                feedbackEl.innerText = `Falsch. Richtige Antwort: "${currentItem.ans}"`;
                blankLine.classList.add('error-line');
                blankLine.innerText = currentItem.ans;
                
                streak = 0;
                isRetry = true; // Fehlerwiederholung aktivieren
                document.getElementById('action-btn').innerText = "Weiter";
                saveProgress();
            }
        } else {
            // Nächste Frage laden
            loadQuestion();
        }
    }

    // Enter-Tasten Unterstützung
    document.getElementById('user-answer').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            handleAction();
        }
    });

    // Initialer Start beim Laden der Seite
    loadQuestion();
</script>
